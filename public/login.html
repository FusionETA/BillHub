<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Bills Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --brand-orange: #FE5000;
      --orange-50: #FFF3EC;
      --orange-600: #DB3F00;
      --blue-500: #1E22AA;
      --neutral-0: #FFFFFF;
      --neutral-50: #F6F7F9;
      --neutral-200: #DEE1E7;
      --neutral-300: #C7CCD5;
      --neutral-500: #6C7480;
      --neutral-700: #363B44;
      --ink-900: #101235;
      --red-500: #E23A2E;
      --red-100: #FBDEDB;
      --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
      --shadow-lg: 0 12px 28px rgba(16, 18, 53, .12), 0 4px 10px rgba(16, 18, 53, .06);
      --ring: 0 0 0 3px rgba(254, 80, 0, .35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: var(--font-body);
      background: var(--neutral-50);
      color: var(--neutral-700);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--neutral-0);
      border: 1px solid var(--neutral-200);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 32px
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -.03em;
      color: var(--ink-900);
      margin-bottom: 4px
    }

    .brand span {
      color: var(--brand-orange)
    }

    h1 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink-900);
      margin: 18px 0 4px
    }

    .sub {
      font-size: 13.5px;
      color: var(--neutral-500);
      margin-bottom: 22px
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-900);
      margin-bottom: 6px
    }

    input {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--neutral-300);
      border-radius: 10px;
      padding: 0 14px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--neutral-700);
      background: var(--neutral-0);
      outline: none;
      margin-bottom: 14px
    }

    input:focus {
      border-color: var(--brand-orange);
      box-shadow: var(--ring)
    }

    button {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 10px;
      background: var(--brand-orange);
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px
    }

    button:hover {
      background: var(--orange-600)
    }

    button[disabled] {
      opacity: .6;
      cursor: default
    }

    .error {
      display: none;
      background: var(--red-100);
      border-left: 4px solid var(--red-500);
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 13px;
      color: #8d1f17;
      margin-bottom: 16px
    }

    .error.on {
      display: block
    }

    /* Which of the two this deployment is cannot be known until the server
       says, and showing a password form to somebody who has no password here
       — even for a moment — is the thing this page exists to stop. So the
       card starts empty and one of the two is revealed. */
    .card>.body {
      display: none
    }

    .card.ready>.body.on {
      display: block
    }

    .waiting {
      height: 132px
    }

    .card.ready .waiting {
      display: none
    }

    a.cta {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--brand-orange);
      color: #fff;
      border-radius: 10px;
      padding: 13px 16px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      margin-top: 4px
    }

    a.cta:hover {
      background: var(--orange-600)
    }

    .note {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--neutral-500);
      margin-bottom: 18px
    }

    .note strong {
      color: var(--neutral-700)
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="brand">Fusion<span>ETA</span></div>
    <h1>Bills Hub</h1>
    <div class="sub" id="sub">Sign in to manage bills across your Xero entities.</div>

    <div class="waiting"></div>

    <!-- This deployment signs people in itself. -->
    <form class="body" id="form">
      <div class="error" id="error" role="alert"></div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submit">Sign in</button>
    </form>

    <!-- This deployment borrows WazzOCR's. There is no password here to type,
         so there is no box to type one into. -->
    <div class="body" id="borrowed">
      <div class="note">
        Bills Hub uses your <strong>WazzOCR</strong> sign-in. Sign in there and
        open Bills Hub from the menu — whoever is signed into WazzOCR is signed
        in here.
      </div>
      <a class="cta" id="goto" href="#">Go to WazzOCR</a>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const form = document.getElementById('form');
    const errorBox = document.getElementById('error');
    const submit = document.getElementById('submit');

    // Only same-origin paths are honoured, so a crafted ?next= can't be used to
    // bounce someone to another site after they sign in.
    function safeNext() {
      const next = new URLSearchParams(location.search).get('next') || '/';
      return /^\/(?!\/)/.test(next) ? next : '/';
    }

    // Ask which sign-in this deployment has before showing either.
    //
    // In borrowed mode the form is not merely useless, it is misleading: the
    // server refuses every password, so somebody types the WazzOCR one they
    // know is right, is told it is wrong, and tries it again. The usual way to
    // land here is a WazzOCR session that has expired, so the person reading
    // this is already signed out of the only place that can help.
    //
    // Only same-origin or an http(s) link is followed, and the link is set
    // from the server's answer rather than from anything in the address bar.
    (async () => {
      let mode = null;
      try {
        const res = await fetch('/api/auth/mode', { credentials: 'same-origin' });
        mode = res.ok ? await res.json() : null;
      } catch { /* offline, or the server is down: fall through to the form */ }

      if (mode && mode.borrowed) {
        document.getElementById('sub').textContent =
          'Bills Hub does not have its own sign-in.';
        const link = document.getElementById('goto');
        const url = String(mode.signInAt || '');
        if (/^https?:\/\//i.test(url)) {
          link.href = url;
        } else {
          // Nowhere to send them. Better to say so than to offer a dead link.
          link.replaceWith(Object.assign(document.createElement('div'), {
            className: 'note',
            textContent: 'Ask your administrator for the WazzOCR address.'
          }));
        }
        document.getElementById('borrowed').classList.add('on');
        card.classList.add('ready');
      } else {
        form.classList.add('on');
        // After `ready`, not before: until the card has it the form is still
        // display:none, and focusing something that is not displayed does
        // nothing at all.
        card.classList.add('ready');
        document.getElementById('email').focus();
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('on');
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Sign-in failed.');
        location.href = safeNext();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('on');
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>

</html>
