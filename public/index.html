      }

      return <Dialog open={open} onClose={onClose} title="Recharge account codes"
        description="Where the two sides of a recharge post in Xero." size="md">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
          <Input label="Payer — receivable account" placeholder="260" value={form.arAccountCode || ''}
            onChange={v => set({ arAccountCode: v })} hint="On the invoice raised in the paying entity." />
          <Input label="Subsidiary — expense account" placeholder="429" value={form.apAccountCode || ''}
            onChange={v => set({ apAccountCode: v })} hint="On the mirror bill in the subsidiary." />
          <Input label="Tax type" placeholder="NONE" value={form.taxType || ''} onChange={v => set({ taxType: v })}
            hint="Xero tax type code, e.g. NONE or ZERORATED." />
          <Input label="Reference prefix" placeholder="IC-" value={form.referencePrefix || ''} onChange={v => set({ referencePrefix: v })} />
          <Input label="Payment terms (days)" type="number" value={String(form.dueDays || 30)} onChange={v => set({ dueDays: Number(v) })} />
          <div style={{ gridColumn: '1 / -1', background: 'var(--neutral-50)', borderRadius: 10, padding: '12px 14px', fontSize: 13, color: 'var(--text-body)', lineHeight: 1.6 }}>
            These codes must exist in every organisation a recharge touches. If one does not, Xero rejects that line and it is reported against the recharge — nothing is left half-posted.
          </div>
          <div style={{ gridColumn: '1 / -1', display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
            <Button variant="outline" size="md" onClick={onClose}>Cancel</Button>
            <Button variant="primary" size="md" onClick={save} style={busy ? { opacity: .6, pointerEvents: 'none' } : null}>Save</Button>
          </div>
        </div>
      </Dialog>;
    }

    /* ---------- Bank files view ---------- */

    // A layout nobody has checked against the bank's own spec can be rejected by
    // the portal — or pay the wrong account. Say so wherever it appears.
    function UnverifiedTag({ children }) {
      return <span title="This layout has not been checked against the bank's own spec sheet."
        style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 700, padding: '3px 8px', borderRadius: 999, background: 'var(--amber-100)', color: '#8a6300', whiteSpace: 'nowrap' }}>
        {children || 'Layout unverified'}
      </span>;
    }

    function BankView({ onToast }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [busy, setBusy] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const [formats, setFormats] = useState([]);
      const [nonce, setNonce] = useState(0);
      const reload = () => setNonce(n => n + 1);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        api.get('/api/payments')
          .then(d => { if (!cancelled) { setData(d); setError(null); } })
          .catch(e => { if (!cancelled) setError(e.message); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [nonce]);

      useEffect(() => {
        api.get('/api/payments/formats').then(d => setFormats(d.formats || [])).catch(() => {});
      }, [nonce]);

      const unverified = new Set(formats.filter(f => !f.verified).map(f => f.key));

      async function runSync() {
        setSyncing(true);
        try {
          const r = await api.post('/api/payments/sync');
          onToast({
            title: 'Synced from Xero',
            message: r.banks + ' paying account' + (r.banks === 1 ? '' : 's') + ' and ' + r.suppliers + ' supplier' + (r.suppliers === 1 ? '' : 's') + ' across ' + r.organisations + ' organisation' + (r.organisations === 1 ? '' : 's') + (r.failed ? ' · ' + r.failed + ' failed' : ''),
            tone: r.failed ? 'error' : 'success'
          });
          reload();
        } catch (e) {
          onToast({
            title: e.payload && e.payload.needsXeroReconnect ? 'Xero needs reconnecting' : 'Sync failed',
            message: e.message, tone: 'error'
          });
        } finally { setSyncing(false); }
      }

      // Downloading is what moves a batch to "downloaded", so the list has to
      // refresh afterwards.
      async function download(batch) {
        setBusy(batch.id);
        try {
          const res = await fetch('/api/payments/batches/' + batch.id + '/file', { credentials: 'same-origin' });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.error || 'Could not build the file.');
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = batch.fileName && batch.fileName !== '—' ? batch.fileName : (batch.ref + '.csv');
          a.click();
          URL.revokeObjectURL(url);
          reload();
        } catch (e) {
          onToast({ title: 'Download failed', message: e.message, tone: 'error' });
        } finally { setBusy(null); }
      }

      async function markUploaded(batch) {
        setBusy(batch.id);
        try {
          const r = await api.post('/api/payments/batches/' + batch.id + '/uploaded');
          onToast({
            title: batch.ref + ' recorded in Xero',
            message: 'Batch payment ' + String(r.batchPaymentId).slice(0, 8) + '… created. The bills are now paid.'
          });
          reload();
        } catch (e) {
          onToast({
            title: e.payload && e.payload.needsXeroReconnect ? 'Xero needs reconnecting' : 'Xero rejected the batch',
            message: e.message, tone: 'error'
          });
          reload();
        } finally { setBusy(null); }
      }

      async function cancelBatch(batch) {
        setBusy(batch.id);
        try {
          await api.post('/api/payments/batches/' + batch.id + '/cancel');
          onToast({ title: batch.ref + ' cancelled', message: 'Its bills are free to go into another run.' });
          reload();
        } catch (e) {
          onToast({ title: 'Could not cancel', message: e.message, tone: 'error' });
        } finally { setBusy(null); }
      }

      const cards = (data && data.batchCards) || [];

      return <div style={{ maxWidth: 1280, margin: '0 auto', padding: '24px 28px 120px' }}>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 20, marginBottom: 22, flexWrap: 'wrap' }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 6 }}><a href="#">Bills Hub</a> <span style={{ color: 'var(--text-subtle)' }}>/</span> <span>Bank payment files</span></div>
            <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 32, fontWeight: 700, letterSpacing: '-.02em', color: 'var(--text-heading)' }}>Bank payment files</h1>
            <p style={{ margin: '8px 0 0', fontSize: 14, color: 'var(--text-muted)', maxWidth: '76ch' }}>
              Paying bills from the Bills tab creates a batch here, in the layout the paying account's bank expects. Download the file, upload it to the banking portal, then mark the batch uploaded — that last step is what records the payment in Xero.
            </p>
          </div>
          <span style={{ flex: 1 }} />
          <Button variant="outline" size="sm" onClick={runSync} style={syncing ? { opacity: .6, pointerEvents: 'none' } : null}>
            {syncing ? 'Syncing…' : 'Sync accounts & payees'}
          </Button>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 14, marginBottom: 20 }}>
          {((data && data.bankStats) || [0, 1, 2, 3].map(() => ({ label: '—', amount: '—', sub: '', color: 'var(--neutral-300)' })))
            .map((s, i) => <StatCard key={i} s={s} />)}
        </div>

        {data && data.payeeWarning && <div style={{ display: 'flex', alignItems: 'center', gap: 14, background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderLeft: '4px solid var(--amber-500)', borderRadius: 10, padding: '14px 18px', marginBottom: 16 }}>
          <div style={{ flex: 1, fontSize: 14, color: 'var(--text-body)' }}>
            <strong style={{ color: 'var(--text-heading)' }}>{data.payeeWarning}</strong> Those lines will be blank in the file and the bank will reject them. Add the details in Xero, or correct them here.
          </div>
        </div>}

        {error
          ? <Placeholder tone="error" title="Could not load payment batches" message={error}
              action={<Button variant="outline" size="md" onClick={reload}>Try again</Button>} />
          : (!loading && cards.length === 0)
            ? <Placeholder
                title="No payment batches yet"
                message="Go to Bills, tick the approved bills you want to pay, and choose Pay selected. The batch and its bank file appear here." />
            : <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 24, opacity: loading ? .55 : 1, transition: 'opacity var(--dur-fast)' }}>
          {cards.map(b => (
            <div key={b.id} style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '16px 18px', background: 'var(--neutral-50)', borderBottom: '1px solid var(--border-subtle)', flexWrap: 'wrap' }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <Code>{b.entityCode}</Code>
                    <span style={{ fontSize: 15, fontWeight: 700, color: 'var(--text-heading)' }}>{b.ref} · {b.bank}</span>
                    {unverified.has(b.format) && <UnverifiedTag />}
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 3 }}>{b.entityLabel} · {b.account} · {b.format} · {b.dateFmt}</div>
                </div>
                <span style={{ flex: 1 }} />
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>{b.countLabel}</div>
                  <div style={{ fontSize: 18, fontWeight: 700, fontVariantNumeric: 'tabular-nums', color: 'var(--text-heading)' }}>{b.currency} {b.totalFmt}</div>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, padding: '4px 10px', borderRadius: 999, background: b.statusBg, color: b.statusFg }}>{b.statusLabel}</span>
                {b.canDownload && <Button variant="primary" size="sm" onClick={() => download(b)} style={busy === b.id ? { opacity: .6, pointerEvents: 'none' } : null}>
                  <Icon name="download" size={15} color="#fff" />Download file
                </Button>}
                {b.canUpload && <Button variant="outline" size="sm" onClick={() => markUploaded(b)} style={busy === b.id ? { opacity: .6, pointerEvents: 'none' } : null}>Mark uploaded</Button>}
                {b.canCancel && <button onClick={() => cancelBatch(b)} title="Cancel this batch and release its bills"
                  style={{ border: 'none', background: 'none', color: 'var(--text-muted)', cursor: 'pointer', padding: 6, display: 'flex', borderRadius: 6 }}><Icon name="trash-2" size={16} /></button>}
              </div>

              {b.postError && <div style={{ padding: '10px 18px', background: 'var(--red-100)', color: '#8d1f17', fontSize: 13 }}>
                <strong>Xero rejected this batch:</strong> {b.postError}
              </div>}

              <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.6fr) 150px 110px minmax(0,1fr)', gap: 10, padding: '10px 18px', fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--text-muted)', borderBottom: '1px solid var(--neutral-100)' }}>
                <div>Payee</div><div>Account</div><div style={{ textAlign: 'right' }}>Amount</div><div>Reference</div>
              </div>
              {b.lines.map((l, j) => (
                <div key={j} style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.6fr) 150px 110px minmax(0,1fr)', gap: 10, alignItems: 'center', padding: '12px 18px', borderBottom: '1px solid var(--neutral-100)', fontSize: 13 }}>
                  <div style={{ fontWeight: 700, color: 'var(--text-heading)', ...Ellip }}>{l.contact}</div>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: l.hasAccount ? 'var(--text-muted)' : 'var(--color-danger)' }}>{l.acct}</div>
                  <div style={{ textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 700, color: 'var(--text-heading)' }}>{l.amountFmt}</div>
                  <div style={{ color: 'var(--text-body)', ...Ellip }}>{l.ref}</div>
                </div>
              ))}
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 18px', flexWrap: 'wrap' }}>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-body)' }}>{b.fileName}</span>
                <span style={{ flex: 1 }} />
                {b.postedNote && <span style={{ fontSize: 12, color: 'var(--green-500)', fontWeight: 600 }}>{b.postedNote}</span>}
                <span style={{ fontSize: 12, color: 'var(--text-subtle)' }}>{b.downloadedNote}</span>
              </div>
            </div>
          ))}
        </div>}
      </div>;
    }

    /* ---------- Notifications (settings) view ---------- */

    const FREQUENCIES = [
      ['daily', 'Daily', 'Every working day'],
      ['weekly', 'Weekly', 'One day each week'],
      ['monthly', 'Monthly', 'One day each month']
    ];
    const WEEKDAYS = [[1, 'Monday'], [2, 'Tuesday'], [3, 'Wednesday'], [4, 'Thursday'], [5, 'Friday'], [6, 'Saturday'], [7, 'Sunday']];
    const SEND_TIMES = ['07:00', '08:00', '08:30', '09:00', '10:00', '12:00', '15:00', '17:00', '18:30'];
    const ROLES = ['Accounts Payable', 'Finance Manager', 'Group Accountant', 'Director', 'Admin'];
    const TIMEZONES = ['Asia/Kuala_Lumpur', 'Asia/Singapore', 'Asia/Jakarta', 'Asia/Bangkok', 'Asia/Hong_Kong', 'Australia/Perth', 'UTC'];

    function SettingsView({ entities, onToast }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [busy, setBusy] = useState(false);
      const [nonce, setNonce] = useState(0);
      const [assignFor, setAssignFor] = useState(null);
      const [previewFor, setPreviewFor] = useState('');       // '' = the group digest
      const [previewText, setPreviewText] = useState('');
      const [testPhone, setTestPhone] = useState('');
      // A new recipient being typed in the bottom row.
      const [draft, setDraft] = useState({ name: '', phone: '', role: ROLES[0], allEntities: true, tenantIds: [] });

      const reload = () => setNonce(n => n + 1);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        api.get('/api/digest')
          .then(d => { if (!cancelled) { setData(d); setPreviewText(d.digestText); setError(null); } })
          .catch(e => { if (!cancelled) setError(e.message); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [nonce]);

      // The preview follows whichever recipient is selected, so you can see the
      // scoped message a branch accountant actually receives.
      useEffect(() => {
        if (!data) return;
        const qs = previewFor ? '?recipientId=' + previewFor : '';
        api.get('/api/digest/preview' + qs)
          .then(d => setPreviewText(d.text))
          .catch(() => {});
      }, [previewFor, data]);

      const s = data && data.settings;

      async function save(patch) {
        setBusy(true);
        try {
          const res = await request('/api/digest/settings', { method: 'PATCH', body: patch });
          setData(d => ({ ...d, settings: res.settings, nextRun: res.nextRun }));
          reload();
        } catch (e) {
          onToast({ title: 'Could not save', message: e.message, tone: 'error' });
        } finally { setBusy(false); }
      }

      async function addRecipient() {
        if (!draft.name.trim() || !draft.phone.trim()) {
          onToast({ title: 'Missing details', message: 'A name and a WhatsApp number are both needed.', tone: 'error' });
          return;
        }
        setBusy(true);
        try {
          await api.post('/api/digest/recipients', draft);
          setDraft({ name: '', phone: '', role: ROLES[0], allEntities: true, tenantIds: [] });
          onToast({ title: 'Recipient added', message: draft.name + ' will receive the digest.' });
          reload();
        } catch (e) {
          onToast({ title: 'Could not add recipient', message: e.message, tone: 'error' });
        } finally { setBusy(false); }
      }

      async function patchRecipient(id, patch) {
        try {
          await request('/api/digest/recipients/' + id, { method: 'PATCH', body: patch });
          reload();
        } catch (e) {
          onToast({ title: 'Could not update', message: e.message, tone: 'error' });
        }
      }

      async function removeRecipient(r) {
        try {
          await request('/api/digest/recipients/' + r.id, { method: 'DELETE' });
          onToast({ title: 'Recipient removed', message: r.name + ' will no longer receive the digest.' });
          reload();
        } catch (e) {
          onToast({ title: 'Could not remove', message: e.message, tone: 'error' });
        }
      }

      async function sendTest() {
        const phone = testPhone.trim() || (s && s.senderPhone) || '';
        if (!phone) { onToast({ title: 'No number', message: 'Enter a WhatsApp number to send the test to.', tone: 'error' }); return; }
        setBusy(true);
        try {
          const r = await api.post('/api/digest/test', { phone });
          onToast({ title: 'Test sent', message: 'Check WhatsApp on ' + r.phone + '.' });
          reload();
        } catch (e) {
          onToast({ title: 'Test failed', message: e.message, tone: 'error' });
        } finally { setBusy(false); }
      }

      async function sendNow() {
        setBusy(true);
        try {
          const r = await api.post('/api/digest/send', {});
          onToast({
            title: r.sent + ' digest' + (r.sent === 1 ? '' : 's') + ' sent',
            message: [r.failed ? r.failed + ' failed' : null, r.skipped ? r.skipped + ' skipped (nothing to clear)' : null]
              .filter(Boolean).join(' · ') || 'Everyone on the list has it.',
            tone: r.failed ? 'error' : 'success'
          });
          reload();
        } catch (e) {
          onToast({ title: 'Could not send', message: e.message, tone: 'error' });
        } finally { setBusy(false); }
      }

      if (error) {
        return <div style={{ maxWidth: 1040, margin: '0 auto', padding: '24px 28px 120px' }}>
          <Placeholder tone="error" title="Could not load notification settings" message={error}
            action={<Button variant="outline" size="md" onClick={reload}>Try again</Button>} />
        </div>;
      }
      if (!s) {
        return <div style={{ maxWidth: 1040, margin: '0 auto', padding: '24px 28px 120px' }}>
          <Placeholder title="Loading…" message="Fetching the digest settings." />
        </div>;
      }

      const recipients = data.recipients || [];

      return <div style={{ maxWidth: 1040, margin: '0 auto', padding: '24px 28px 120px', opacity: loading ? .6 : 1, transition: 'opacity var(--dur-fast)' }}>
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 6 }}><a href="#">Bills Hub</a> <span style={{ color: 'var(--text-subtle)' }}>/</span> <span>Notifications</span></div>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 32, fontWeight: 700, letterSpacing: '-.02em', color: 'var(--text-heading)' }}>WhatsApp notifications</h1>
          <p style={{ margin: '8px 0 0', fontSize: 15, color: 'var(--text-muted)', maxWidth: '70ch' }}>
            Send finance a digest of draft bills waiting to be cleared across your {data.entityCount} Xero {data.entityCount === 1 ? 'entity' : 'entities'}. Each recipient can get the group total or only the entities they look after.
          </p>
        </div>

        {/* Master switch and channel health, up front — everything below is moot
            without them. */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderLeft: '4px solid ' + (s.enabled ? 'var(--green-500)' : 'var(--neutral-300)'), borderRadius: 12, padding: '16px 18px', marginBottom: 16, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 240 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--text-heading)' }}>{s.enabled ? 'Digest is on' : 'Digest is off'}</div>
            <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 3 }}>{data.nextRun}</div>
          </div>
          {!s.configured && <span style={{ fontSize: 12, fontWeight: 700, padding: '4px 10px', borderRadius: 999, background: 'var(--red-100)', color: 'var(--red-500)' }}>No WhatsApp channel</span>}
          {s.configured && s.senderPhoneFmt && <span style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>Sending from <strong style={{ color: 'var(--text-body)' }}>{s.senderPhoneFmt}</strong></span>}
          <Switch checked={s.enabled} onChange={v => save({ enabled: v })} />
        </div>

        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 16 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Schedule</div>
          <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>How often the draft-bills digest is sent. Times are local to {s.timezone}.</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 }}>
            {FREQUENCIES.map(([k, lab, sub]) => {
              const on = s.frequency === k;
              return <div key={k} onClick={() => save({ frequency: k })}
                style={{ border: '1.5px solid ' + (on ? 'var(--color-primary)' : 'var(--border-subtle)'), background: on ? 'var(--orange-50)' : 'var(--surface-card)', borderRadius: 12, padding: '14px 16px', cursor: 'pointer' }}>
                <Radio label={lab} checked={on} />
                <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6, paddingLeft: 30 }}>{sub}</div>
              </div>;
            })}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 14, marginTop: 16 }}>
            <Select label="Send time" value={s.sendTime} onChange={v => save({ sendTime: v })}
              options={SEND_TIMES.map(t => ({ label: t, value: t }))} />
            {s.frequency === 'weekly' && <Select label="Day of week" value={String(s.dayOfWeek)} onChange={v => save({ dayOfWeek: Number(v) })}
              options={WEEKDAYS.map(([n, lab]) => ({ label: lab, value: String(n) }))} />}
            {s.frequency === 'monthly' && <Select label="Day of month" value={String(s.dayOfMonth)} onChange={v => save({ dayOfMonth: Number(v) })}
              options={[1, 5, 10, 15, 20, 25].map(n => ({ label: String(n), value: String(n) })).concat([{ label: 'Last day', value: '0' }])} />}
            <Select label="Timezone" value={s.timezone} onChange={v => save({ timezone: v })}
              options={TIMEZONES.map(t => ({ label: t, value: t }))} />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 18, paddingTop: 18, borderTop: '1px solid var(--border-subtle)' }}>
            {s.frequency === 'daily' && <Switch label="Skip weekends" checked={s.workingDaysOnly} onChange={v => save({ workingDaysOnly: v })} />}
            <Switch label={'Include a per-entity breakdown of the top ' + s.breakdownLimit} checked={s.includeBreakdown} onChange={v => save({ includeBreakdown: v })} />
            <Switch label="Send even when there are no draft bills" checked={s.sendWhenEmpty} onChange={v => save({ sendWhenEmpty: v })} />
          </div>
        </div>

        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 16 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Recipients</div>
          <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>{data.recipientMeta}</div>

          {recipients.length > 0 && <div style={{ display: 'grid', gridTemplateColumns: '1fr 150px 130px minmax(200px,1.2fr) 72px 40px', gap: 10, padding: '0 12px 8px', fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>
            <div>Name</div><div>WhatsApp number</div><div>Role</div><div>Xero entities</div><div>Active</div><div />
          </div>}
          {recipients.map(p => (
            <div key={p.id} style={{ display: 'grid', gridTemplateColumns: '1fr 150px 130px minmax(200px,1.2fr) 72px 40px', gap: 10, alignItems: 'center', padding: 12, borderTop: '1px solid var(--neutral-100)', fontSize: 14 }}>
              <div style={{ fontWeight: 700, color: 'var(--text-heading)', ...Ellip }}>{p.name}</div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--text-body)' }}>{p.phone}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 13, ...Ellip }}>{p.role}</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 5, minWidth: 0, flexWrap: 'wrap' }}>
                  {p.allEntities && <span style={{ fontSize: 12, fontWeight: 700, padding: '3px 9px', borderRadius: 999, background: 'var(--orange-50)', color: 'var(--orange-600)' }}>All {data.entityCount} entities</span>}
                  {!p.allEntities && p.chips.map((c, j) => <Code key={j}>{c.code}</Code>)}
                  {!p.allEntities && !p.chips.length && <span style={{ fontSize: 12, color: 'var(--color-danger)' }}>No entities assigned</span>}
                  {p.hasMore && <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{p.moreLabel}</span>}
                </div>
                <button onClick={() => setAssignFor(p)} className="feta-hover" style={{ flex: '0 0 auto', border: '1.5px solid var(--border-default)', background: 'var(--surface-card)', borderRadius: 999, padding: '4px 11px', fontSize: 12, fontWeight: 700, color: 'var(--color-secondary)', cursor: 'pointer' }}>Assign</button>
              </div>
              <div><Switch checked={p.on} onChange={v => patchRecipient(p.id, { enabled: v })} /></div>
              <div style={{ textAlign: 'right' }}>
                <button aria-label={'Remove ' + p.name} onClick={() => removeRecipient(p)} className="feta-hover"
                  style={{ border: 'none', background: 'none', color: 'var(--text-subtle)', cursor: 'pointer', padding: 6, display: 'inline-flex', borderRadius: '50%' }}><Icon name="trash-2" size={16} /></button>
              </div>
            </div>
          ))}

          <div style={{ marginTop: 18, paddingTop: 18, borderTop: '1px solid var(--border-subtle)', display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 12, alignItems: 'flex-end' }}>
            <Input label="Name" placeholder="Full name" value={draft.name} onChange={v => setDraft(d => ({ ...d, name: v }))} />
            <Input label="WhatsApp number" placeholder="+60 12-345 6789" value={draft.phone} onChange={v => setDraft(d => ({ ...d, phone: v }))} />
            <Select label="Role" value={draft.role} onChange={v => setDraft(d => ({ ...d, role: v }))} options={ROLES} />
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-heading)', marginBottom: 6 }}>Xero entities</div>
              <button onClick={() => setAssignFor({ draft: true, allEntities: draft.allEntities, entityIds: draft.tenantIds, name: draft.name || 'New recipient', phone: draft.phone })}
                className="feta-hover" style={{ width: '100%', height: 46, border: '1.5px solid var(--border-default)', background: 'var(--surface-card)', borderRadius: 10, padding: '0 14px', fontSize: 14, fontWeight: 600, color: 'var(--text-body)', cursor: 'pointer', textAlign: 'left', ...Ellip }}>
                {draft.allEntities ? `All ${data.entityCount} entities` : `${draft.tenantIds.length} selected`}
              </button>
            </div>
            <Button variant="outline" size="md" onClick={addRecipient} style={busy ? { opacity: .6, pointerEvents: 'none' } : null}>Add recipient</Button>
          </div>
        </div>

        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 16 }}>
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 16, marginBottom: 16, flexWrap: 'wrap' }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Message preview</div>
              <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>
                {data.previewSummary.count} draft{data.previewSummary.count === 1 ? '' : 's'} · RM {data.previewSummary.total} group-wide. This is the real message, built from the same figures as the Bills screen.
              </div>
            </div>
            <span style={{ flex: 1 }} />
            <div style={{ minWidth: 210 }}>
              <Select label="Preview as" value={previewFor} onChange={setPreviewFor}
                options={[{ label: 'Group digest', value: '' }].concat(recipients.map(r => ({ label: r.name, value: String(r.id) })))} />
            </div>
          </div>
          <div style={{ background: 'var(--green-100)', borderRadius: 14, padding: 20 }}>
            <div style={{ maxWidth: 520, background: '#fff', borderRadius: 12, borderTopLeftRadius: 2, padding: '16px 18px', boxShadow: 'var(--shadow-sm)', fontFamily: 'var(--font-mono)', fontSize: 12.5, lineHeight: 1.65, color: 'var(--text-heading)', whiteSpace: 'pre-wrap' }}>{previewText}</div>
          </div>
        </div>

        {data.runs && data.runs.length > 0 && <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 20 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Recent sends</div>
          <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 14 }}>What actually went out, and to whom.</div>
          {data.runs.slice(0, 8).map(r => (
            <div key={r.id} style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 150px 110px 120px', gap: 10, alignItems: 'center', padding: '10px 2px', borderTop: '1px solid var(--neutral-100)', fontSize: 13 }}>
              <div style={{ fontWeight: 600, color: 'var(--text-heading)', ...Ellip }}>{r.recipient}{r.error ? <span style={{ fontWeight: 400, color: 'var(--color-danger)' }}> — {r.error}</span> : null}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 12.5 }}>{r.atFmt}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 12.5 }}>{r.draftCount} draft{r.draftCount === 1 ? '' : 's'}</div>
              <div style={{ textAlign: 'right' }}>
                <span style={{ fontSize: 11, fontWeight: 700, padding: '3px 9px', borderRadius: 999,
                  background: r.status === 'sent' ? 'var(--green-100)' : r.status === 'failed' ? 'var(--red-100)' : 'var(--neutral-100)',
                  color: r.status === 'sent' ? '#126b42' : r.status === 'failed' ? 'var(--red-500)' : 'var(--neutral-600)' }}>
                  {r.status}{r.trigger !== 'schedule' ? ' · ' + r.trigger : ''}
                </span>
              </div>
            </div>
          ))}
        </div>}

        <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end', alignItems: 'flex-end', flexWrap: 'wrap' }}>
          <div style={{ width: 210 }}>
            <Input label="Send a test to" placeholder={s.senderPhoneFmt || '+60 12-345 6789'} value={testPhone} onChange={setTestPhone} />
          </div>
          <Button variant="ghost" size="md" onClick={sendTest} style={busy || !s.configured ? { opacity: .5, pointerEvents: 'none' } : null}>Send test message</Button>
          <Button variant="primary" size="md" onClick={sendNow}
            style={busy || !s.configured || !recipients.some(r => r.on) ? { opacity: .5, pointerEvents: 'none' } : null}>
            Send digest now
          </Button>
        </div>

        <AssignDialog open={Boolean(assignFor)} target={assignFor} entities={entities} entityCount={data.entityCount}
          onClose={() => setAssignFor(null)}
          onSave={(allEntities, tenantIds) => {
            if (assignFor && assignFor.draft) setDraft(d => ({ ...d, allEntities, tenantIds }));
            else patchRecipient(assignFor.id, { allEntities, tenantIds });
            setAssignFor(null);
          }} />
      </div>;
    }

    // Picks which Xero organisations a recipient's digest covers.
    function AssignDialog({ open, target, entities, entityCount, onClose, onSave }) {
      const [allEntities, setAllEntities] = useState(true);
      const [selected, setSelected] = useState([]);
      const [query, setQuery] = useState('');

      useEffect(() => {
        if (!target) return;
        setAllEntities(Boolean(target.allEntities));
        setSelected(target.entityIds || []);
        setQuery('');
      }, [target]);

      const shown = entities.filter(e => !query || (e.code + ' ' + e.short).toLowerCase().includes(query.toLowerCase()));
      const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : s.concat(id));

      return <Dialog open={open} onClose={onClose} title="Assign Xero entities"
        description={target ? `${target.name}${target.phone ? ' · ' + target.phone : ''}` : ''} size="md">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'flex', gap: 10 }}>
            <div onClick={() => setAllEntities(true)} style={{ flex: 1, border: '1.5px solid ' + (allEntities ? 'var(--color-primary)' : 'var(--border-subtle)'), background: allEntities ? 'var(--orange-50)' : 'var(--surface-card)', borderRadius: 12, padding: '14px 16px', cursor: 'pointer' }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-heading)' }}>All entities</div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>Group-wide totals for all {entityCount} companies. New entities are included automatically.</div>
            </div>
            <div onClick={() => setAllEntities(false)} style={{ flex: 1, border: '1.5px solid ' + (!allEntities ? 'var(--color-primary)' : 'var(--border-subtle)'), background: !allEntities ? 'var(--orange-50)' : 'var(--surface-card)', borderRadius: 12, padding: '14px 16px', cursor: 'pointer' }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-heading)' }}>Selected entities</div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>Only the drafts belonging to the entities ticked below.</div>
            </div>
          </div>

          <div style={{ opacity: allEntities ? .45 : 1, pointerEvents: allEntities ? 'none' : 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>{selected.length} of {entities.length} entities selected</span>
              <span style={{ flex: 1 }} />
              <button onClick={() => setSelected(entities.map(e => e.tenantId))} style={{ border: 'none', background: 'none', fontSize: 12, fontWeight: 700, color: 'var(--text-link)', cursor: 'pointer' }}>Select all {entities.length}</button>
              <button onClick={() => setSelected([])} style={{ border: 'none', background: 'none', fontSize: 12, fontWeight: 700, color: 'var(--text-muted)', cursor: 'pointer' }}>Clear</button>
            </div>
            <Input placeholder="Search entities" value={query} onChange={setQuery} />
            <div style={{ marginTop: 10, maxHeight: 236, overflow: 'auto', border: '1px solid var(--border-subtle)', borderRadius: 10, padding: '10px 12px', display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: '8px 16px' }}>
              {shown.length === 0 && <div style={{ gridColumn: '1 / -1', fontSize: 13, color: 'var(--text-muted)' }}>{entities.length ? 'No entities match.' : 'Connect Xero in WazzOCR to load your entities.'}</div>}
              {shown.map(e => (
                <div key={e.tenantId} onClick={() => toggle(e.tenantId)} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, minWidth: 0, cursor: 'pointer' }}>
                  <Checkbox checked={selected.includes(e.tenantId)} /><Code>{e.code}</Code>
                  <span style={{ flex: 1, minWidth: 0, color: 'var(--text-body)', ...Ellip }}>{e.short}</span>
                </div>))}
            </div>
          </div>

          <div style={{ background: 'var(--neutral-50)', borderRadius: 10, padding: '12px 14px', fontSize: 13, color: 'var(--text-body)' }}>
            {allEntities
              ? 'Receives group-wide draft totals for every entity.'
              : selected.length
                ? `Receives draft totals for ${selected.length} entit${selected.length === 1 ? 'y' : 'ies'} only.`
                : 'No entities selected — this recipient would get nothing.'}
          </div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
            <Button variant="outline" size="md" onClick={onClose}>Cancel</Button>
            <Button variant="primary" size="md" onClick={() => onSave(allEntities, selected)}>Save assignment</Button>
          </div>
        </div>
      </Dialog>;
    }

    function App() {
      const [view, setView] = useState('bills');
      const [me, setMe] = useState(null);
      const [xero, setXero] = useState(null);
      const [entities, setEntities] = useState([]);
      const [toasts, setToasts] = useState([]);

      const pushToast = useCallback((t) => {
        const id = Date.now() + Math.random();
        setToasts(list => list.concat({ ...t, id }));
        setTimeout(() => setToasts(list => list.filter(x => x.id !== id)), t.tone === 'error' ? 9000 : 5000);
      }, []);

      const loadContext = useCallback(() => {
        api.get('/api/auth/me').then(setMe).catch(() => {});
        api.get('/api/xero/status').then(setXero).catch(() => setXero({ connected: false, count: 0 }));
        api.get('/api/bills/entities').then(d => setEntities(d.entities || [])).catch(() => {});
      }, []);

      useEffect(loadContext, [loadContext]);

      // Report the outcome of the Xero consent round trip, then take the result
      // out of the address bar so a refresh doesn't replay the toast.
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const result = params.get('xero');
        if (!result) return;
        if (result === 'connected') {
          const orgs = params.get('orgs') || '0';
          pushToast({ title: 'Xero connected', message: orgs + ' organisation' + (orgs === '1' ? '' : 's') + ' linked. Run a sync to pull their bills in.' });
        } else {
          pushToast({ title: 'Xero connection failed', message: params.get('message') || 'Please try again.', tone: 'error' });
        }
        window.history.replaceState({}, '', window.location.pathname);
      }, [pushToast]);

      const viewTabs = [
        { value: 'bills', label: 'Bills' },
        { value: 'recharge', label: 'Recharge' },
        { value: 'bank', label: 'Bank files' },
        { value: 'settings', label: 'Notifications' }
      ];
      const orgCount = xero ? xero.count || 0 : null;
      const connected = xero ? xero.connected : true;
      const needsReconnect = (xero && xero.needsReconnect) || 0;
      // Where the badge sends people: this app's own consent when it owns the
      // grant, or WazzOCR when it is borrowing one.
      const manageAt = (xero && xero.manageAt) || null;
      const canConnectHere = Boolean(xero && xero.canConnectHere);
      // In own mode the badge always reaches the consent: reconnecting is how you
      // add another organisation, so hiding it once connected leaves no route to
      // that at all.
      const xeroHref = manageAt || (canConnectHere ? '/api/xero/connect' : null);
      const xeroProblem = (xero && xero.error) || null;
      const openAccess = Boolean(me && me.authDisabled);

      return <div style={{ minHeight: '100vh', background: 'var(--surface-page)' }}>
        <header style={{ position: 'sticky', top: 0, zIndex: 40, background: 'var(--ink-900)', padding: '0 28px', display: 'flex', alignItems: 'center', gap: 20, height: 64 }}>
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 20, letterSpacing: '-.03em', color: '#fff' }}>Fusion<span style={{ color: 'var(--orange-500)' }}>ETA</span></span>
          <span style={{ width: 1, height: 26, background: 'rgba(255,255,255,.18)' }} />
          <span style={{ whiteSpace: 'nowrap', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 16, letterSpacing: '-.01em', color: '#fff' }}>Bills Hub</span>
          <span style={{ whiteSpace: 'nowrap', fontSize: 11, fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--orange-400)' }}>{(me && me.account && me.account.name) || ''}</span>
          <span style={{ flex: 1 }} />
          <Tabs tabs={viewTabs} value={view} onChange={setView} variant="pill" />
          <a href={xeroHref || undefined} target={manageAt ? '_blank' : undefined} rel="noreferrer"
            title={xeroProblem
              || (needsReconnect ? needsReconnect + ' organisation(s) need reconnecting'
                : canConnectHere ? (connected ? 'Connected. Click to add another organisation or reconnect.' : 'Connect Xero')
                : 'Xero is connected through WazzOCR')}
            style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 12px', borderRadius: 999, background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.82)', fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap', textDecoration: 'none', cursor: xeroHref ? 'pointer' : 'default' }}>
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: needsReconnect ? 'var(--amber-500)' : connected ? 'var(--green-500)' : 'var(--red-500)' }} />
            <span>{orgCount === null ? 'Checking Xero…' : connected ? orgCount + ' Xero ' + (orgCount === 1 ? 'entity' : 'entities') + ' connected' : 'Connect Xero'}</span>
            {canConnectHere && connected && <span style={{ opacity: .55, fontSize: 11 }}>· add</span>}
          </a>
          {!openAccess && <div title={me && me.user ? me.user.email : ''} style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--blue-500)', color: '#fff', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 700 }}>{(me && me.user && me.user.initials) || '–'}</div>}
        </header>

        {/* Sign-in is off, and this app can change bills in a live Xero. Keep
            that visible rather than letting it be forgotten. */}
        {openAccess && <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, background: 'var(--amber-100)', borderBottom: '1px solid #e7c96b', padding: '9px 20px', fontSize: 13, color: '#6b4d00' }}>
          <strong style={{ color: '#5a4100' }}>Sign-in is off.</strong>
          <span>Anyone who can open this page can submit and approve bills in your Xero organisations.</span>
        </div>}

        {view === 'bills' && <BillsView entities={entities} xero={xero} onToast={pushToast} onSynced={loadContext} onPaid={() => setView('bank')} />}
        {view === 'recharge' && <RechargeView entities={entities} onToast={pushToast} />}
        {view === 'bank' && <BankView onToast={pushToast} />}
        {view === 'settings' && <SettingsView entities={entities} onToast={pushToast} />}

        <div style={{ position: 'fixed', right: 20, bottom: 20, zIndex: 120, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {toasts.map(t => <Toast key={t.id} title={t.title} message={t.message} tone={t.tone} onClose={() => setToasts(list => list.filter(x => x.id !== t.id))} />)}
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>

</html>
