  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const VM = window.VM;

    /* ---------- Icons (lucide-style, inline) ---------- */
    function Icon({ name, size = 16, color = 'currentColor', stroke = 2 }) {
      const P = {
        x: <path d="M18 6 6 18M6 6l12 12" />,
        'trash-2': <g><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M10 11v6M14 11v6" /></g>,
        paperclip: <path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 1 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />,
        'file-check': <g><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" /><path d="M14 2v5h5" /><path d="m9 15 2 2 4-4" /></g>,
        download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="M7 10l5 5 5-5" /><path d="M12 15V3" /></g>,
        check: <path d="M20 6 9 17l-5-5" />,
      }[name];
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{P}</svg>;
    }

    /* ---------- Design-system primitives ---------- */
    function Tabs({ tabs, value, onChange, variant = 'line' }) {
      if (variant === 'pill') {
        return <div style={{ display: 'inline-flex', gap: 4, padding: 4, borderRadius: 999, background: 'rgba(255,255,255,.08)' }}>
          {tabs.map(t => {
            const on = t.value === value; return (
              <button key={t.value} onClick={() => onChange && onChange(t.value)} className="feta-hover"
                style={{
                  border: 'none', cursor: 'pointer', borderRadius: 999, padding: '0 16px', height: 32, fontSize: 13, fontWeight: 700,
                  background: on ? '#fff' : 'transparent', color: on ? 'var(--ink-900)' : 'rgba(255,255,255,.72)'
                }}>{t.label}</button>);
          })}
        </div>;
      }
      return <div style={{ display: 'flex', gap: 4 }}>
        {tabs.map(t => {
          const on = t.value === value; return (
            <button key={t.value} onClick={() => onChange && onChange(t.value)} className="feta-hover"
              style={{
                border: 'none', background: 'none', cursor: 'pointer', padding: '0 4px', height: 48, display: 'inline-flex', alignItems: 'center', gap: 8,
                fontSize: 14, fontWeight: 700, color: on ? 'var(--text-heading)' : 'var(--text-muted)',
                borderBottom: '2.5px solid ' + (on ? 'var(--color-primary)' : 'transparent'), marginBottom: -1.5
              }}>
              <span style={{ padding: '0 8px' }}>{t.label}</span>
              {typeof t.count === 'number' && <span style={{
                fontSize: 11, fontWeight: 700, minWidth: 20, height: 20, padding: '0 6px', borderRadius: 999, display: 'inline-grid', placeItems: 'center',
                background: on ? 'var(--orange-50)' : 'var(--surface-sunken)', color: on ? 'var(--orange-600)' : 'var(--text-muted)'
              }}>{t.count}</span>}
            </button>);
        })}
      </div>;
    }

    function Button({ variant = 'primary', size = 'md', children, onClick, style }) {
      const h = size === 'sm' ? 36 : 46, pad = size === 'sm' ? '0 14px' : '0 18px', fs = size === 'sm' ? 13 : 14;
      const V = {
        primary: { background: 'var(--color-primary)', color: '#fff', border: '1.5px solid var(--color-primary)' },
        secondary: { background: 'var(--color-secondary)', color: '#fff', border: '1.5px solid var(--color-secondary)' },
        outline: { background: 'var(--surface-card)', color: 'var(--text-heading)', border: '1.5px solid var(--border-default)' },
        ghost: { background: 'transparent', color: 'var(--text-body)', border: '1.5px solid transparent' },
      }[variant];
      return <button onClick={onClick} className="feta-hover"
        style={{ ...V, height: h, padding: pad, borderRadius: 10, fontSize: fs, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, ...style }}>{children}</button>;
    }

    function Field({ label, hint, children }) {
      return <label style={{ display: 'block' }}>
        {label && <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-heading)', marginBottom: 6 }}>{label}</div>}
        {children}
        {hint && <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>{hint}</div>}
      </label>;
    }
    function Input({ label, hint, placeholder, type = 'text', value = '' }) {
      return <Field label={label} hint={hint}>
        <input defaultValue={value} type={type} placeholder={placeholder}
          style={{ width: '100%', height: 46, border: '1.5px solid var(--border-default)', borderRadius: 10, padding: '0 14px', fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: 600, color: 'var(--text-body)', background: 'var(--surface-card)', outline: 'none' }}
          onFocus={e => { e.target.style.borderColor = 'var(--color-primary)'; e.target.style.boxShadow = 'var(--ring)'; }}
          onBlur={e => { e.target.style.borderColor = 'var(--border-default)'; e.target.style.boxShadow = 'none'; }} />
      </Field>;
    }
    function Select({ label, options = [], value }) {
      return <Field label={label}>
        <div style={{ position: 'relative' }}>
          <select defaultValue={value}
            style={{ width: '100%', height: 46, border: '1.5px solid var(--border-default)', borderRadius: 10, padding: '0 34px 0 14px', fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: 600, color: 'var(--text-body)', background: 'var(--surface-card)', appearance: 'none', cursor: 'pointer', outline: 'none' }}>
            {options.map(o => <option key={o}>{o}</option>)}
          </select>
          <span style={{ position: 'absolute', right: 14, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', fontSize: 11, pointerEvents: 'none' }}>▾</span>
        </div>
      </Field>;
    }
    function Checkbox({ checked }) {
      return <span style={{ width: 20, height: 20, borderRadius: 6, border: '1.5px solid ' + (checked ? 'var(--color-primary)' : 'var(--border-default)'), background: checked ? 'var(--color-primary)' : 'var(--surface-card)', display: 'inline-grid', placeItems: 'center', flex: '0 0 auto', cursor: 'pointer' }}>
        {checked && <Icon name="check" size={13} color="#fff" stroke={3} />}
      </span>;
    }
    function Radio({ checked, label }) {
      return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
        <span style={{ width: 20, height: 20, borderRadius: '50%', border: '2px solid ' + (checked ? 'var(--color-primary)' : 'var(--border-default)'), display: 'inline-grid', placeItems: 'center', flex: '0 0 auto' }}>
          {checked && <span style={{ width: 10, height: 10, borderRadius: '50%', background: 'var(--color-primary)' }} />}
        </span>
        {label && <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-heading)' }}>{label}</span>}
      </span>;
    }
    function Switch({ checked, label }) {
      const sw = <span style={{ width: 42, height: 24, borderRadius: 999, background: checked ? 'var(--color-primary)' : 'var(--neutral-300)', position: 'relative', flex: '0 0 auto', cursor: 'pointer', transition: 'background var(--dur-fast)' }}>
        <span style={{ position: 'absolute', top: 2, left: checked ? 20 : 2, width: 20, height: 20, borderRadius: '50%', background: '#fff', boxShadow: 'var(--shadow-sm)', transition: 'left var(--dur-fast) var(--ease-out)' }} />
      </span>;
      if (!label) return sw;
      return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 12, cursor: 'pointer' }}>{sw}<span style={{ fontSize: 14, color: 'var(--text-body)' }}>{label}</span></span>;
    }

    function Dialog({ open, title, description, size = 'md', onClose, children }) {
      if (!open) return null;
      const w = size === 'sm' ? 440 : 640;
      return <div style={{ position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(16,18,53,.45)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }} onClick={onClose}>

        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 6 }}><a href="#">Bills Hub</a> <span style={{ color: 'var(--text-subtle)' }}>/</span> <span>Settings</span></div>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 32, fontWeight: 700, letterSpacing: '-.02em', color: 'var(--text-heading)' }}>WhatsApp notifications</h1>
          <p style={{ margin: '8px 0 0', fontSize: 15, color: 'var(--text-muted)', maxWidth: '70ch' }}>Send finance a digest of draft bills waiting to be cleared across all 40 Ayu Borneo Xero entities. Admins manage the schedule and the numbers that receive it.</p>
        </div>
        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 16 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Schedule</div>
          <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>How often the draft-bills digest is sent.</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 }}>
            {FR.map(([k, lab, sub]) => {
              const on = freq === k; return (
                <div key={k} onClick={() => setFreq(k)} style={{ border: '1.5px solid ' + (on ? 'var(--color-primary)' : 'var(--border-subtle)'), background: on ? 'var(--orange-50)' : 'var(--surface-card)', borderRadius: 12, padding: '14px 16px', cursor: 'pointer' }}>
                  <Radio name="freq" label={lab} checked={on} />
                  <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6, paddingLeft: 30 }}>{sub}</div>
                </div>);
            })}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 14, marginTop: 16 }}>
            <Select label="Send time (MYT)" options={['07:00', '08:00', '09:00', '12:00', '17:00', '18:30']} value="09:00" />
            {freq === 'weekly' && <Select label="Day of week" options={['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday']} value="Monday" />}
            {freq === 'monthly' && <Select label="Day of month" options={['1', '5', '10', '15', '20', '25', 'Last day']} value="1" />}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 18, paddingTop: 18, borderTop: '1px solid var(--border-subtle)' }}>
            <Switch label="Include a per-entity breakdown of the top 3 entities" checked={true} />
            <Switch label="Send even when there are no draft bills" checked={false} />
          </div>
        </div>
        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 16 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Recipients</div>
          <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>{VM.recipientMeta}</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 150px 130px minmax(200px,1.2fr) 72px 40px', gap: 10, padding: '0 12px 8px', fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>
            <div>Name</div><div>WhatsApp number</div><div>Role</div><div>Xero entities</div><div>Active</div><div />
          </div>
          {VM.recipients.map((p, i) => (
            <div key={i} style={{ display: 'grid', gridTemplateColumns: '1fr 150px 130px minmax(200px,1.2fr) 72px 40px', gap: 10, alignItems: 'center', padding: 12, borderTop: '1px solid var(--neutral-100)', fontSize: 14 }}>
              <div style={{ fontWeight: 700, color: 'var(--text-heading)' }}>{p.name}</div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--text-body)' }}>{p.phone}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>{p.role}</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 5, minWidth: 0, flexWrap: 'wrap' }}>
                  {p.allEntities && <span style={{ fontSize: 12, fontWeight: 700, padding: '3px 9px', borderRadius: 999, background: 'var(--orange-50)', color: 'var(--orange-600)' }}>All 40 entities</span>}
                  {p.chips.map((c, j) => <span key={j} style={{ fontFamily: 'var(--font-mono)', fontSize: 10, fontWeight: 700, color: 'var(--blue-600)', background: 'var(--blue-50)', padding: '3px 6px', borderRadius: 4 }}>{c.code}</span>)}
                  {p.hasMore && <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>{p.moreLabel}</span>}
                </div>
                <button onClick={onAssign} className="feta-hover" style={{ flex: '0 0 auto', border: '1.5px solid var(--border-default)', background: 'var(--surface-card)', borderRadius: 999, padding: '4px 11px', fontSize: 12, fontWeight: 700, color: 'var(--color-secondary)', cursor: 'pointer' }}>Assign</button>
              </div>
              <div><Switch checked={p.on} /></div>
              <div style={{ textAlign: 'right' }}><button aria-label="Remove recipient" className="feta-hover" style={{ border: 'none', background: 'none', color: 'var(--text-subtle)', cursor: 'pointer', padding: 6, display: 'inline-flex', borderRadius: '50%' }}><Icon name="trash-2" size={16} /></button></div>
            </div>
          ))}
          <div style={{ marginTop: 18, paddingTop: 18, borderTop: '1px solid var(--border-subtle)', display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 12, alignItems: 'flex-end' }}>
            <Input label="Name" placeholder="Full name" />
            <Input label="WhatsApp number" placeholder="+60 12-345 6789" />
            <Select label="Role" options={['Accounts Payable', 'Finance Manager', 'Group Accountant', 'Director', 'Admin']} />
            <div><div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-heading)', marginBottom: 6 }}>Xero entities</div>
              <button onClick={onAssign} className="feta-hover" style={{ width: '100%', height: 46, border: '1.5px solid var(--border-default)', background: 'var(--surface-card)', borderRadius: 10, padding: '0 14px', fontSize: 14, fontWeight: 600, color: 'var(--text-body)', cursor: 'pointer', textAlign: 'left' }}>All 40 entities</button>
            </div>
            <Button variant="outline" size="md">Add recipient</Button>
          </div>
        </div>
        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 16, padding: 22, marginBottom: 20 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 18, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 4 }}>Message preview</div>
          <div style={{ fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 }}>Group-wide digest · 11 drafts · RM 37,480.40. Recipients assigned to specific entities receive the same message scoped to their entities.</div>
          <div style={{ background: 'var(--green-100)', borderRadius: 14, padding: 20 }}>
            <div style={{ maxWidth: 520, background: '#fff', borderRadius: 12, borderTopLeftRadius: 2, padding: '16px 18px', boxShadow: 'var(--shadow-sm)', fontFamily: 'var(--font-mono)', fontSize: 12.5, lineHeight: 1.65, color: 'var(--text-heading)', whiteSpace: 'pre-wrap' }}>{VM.digestText}</div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
          <Button variant="ghost" size="md">Send test message</Button>
          <Button variant="primary" size="md">Save settings</Button>
        </div>
      </div>;
    }

    /* ---------- App shell ---------- */
    function App() {
      const [view, setView] = useState('bills');
      const [assignOpen, setAssignOpen] = useState(false);
      const [paidOpen, setPaidOpen] = useState(false);
      const viewTabs = [{ value: 'bills', label: 'Bills' }, { value: 'recharge', label: 'Recharge' }, { value: 'bank', label: 'Bank files' }, { value: 'settings', label: 'Notifications' }];
      return <div style={{ minHeight: '100vh', background: 'var(--surface-page)' }}>
        <header style={{ position: 'sticky', top: 0, zIndex: 40, background: 'var(--ink-900)', padding: '0 28px', display: 'flex', alignItems: 'center', gap: 20, height: 64 }}>
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 20, letterSpacing: '-.03em', color: '#fff' }}>Fusion<span style={{ color: 'var(--orange-500)' }}>ETA</span></span>
          <span style={{ width: 1, height: 26, background: 'rgba(255,255,255,.18)' }} />
          <span style={{ whiteSpace: 'nowrap', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 16, letterSpacing: '-.01em', color: '#fff' }}>Bills Hub</span>
          <span style={{ whiteSpace: 'nowrap', fontSize: 11, fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--orange-400)' }}>Ayu Borneo Group</span>
          <span style={{ flex: 1 }} />
          <Tabs tabs={viewTabs} value={view} onChange={setView} variant="pill" />
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 12px', borderRadius: 999, background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.82)', fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap' }}>
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--green-500)' }} /><span>40 Xero entities connected</span>
          </div>
          <div style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--blue-500)', color: '#fff', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 700 }}>NA</div>
        </header>

        {view === 'bills' && <BillsView />}
        {view === 'recharge' && <RechargeView />}
        {view === 'bank' && <BankView />}
        {view === 'settings' && <SettingsView onAssign={() => setAssignOpen(true)} />}

        <Dialog open={assignOpen} onClose={() => setAssignOpen(false)} title="Assign Xero entities" description="Chin Wei Loong · +60 16-228 4410" size="md">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={{ display: 'flex', gap: 10 }}>
              <div style={{ flex: 1, border: '1.5px solid var(--border-subtle)', background: 'var(--surface-card)', borderRadius: 12, padding: '14px 16px', cursor: 'pointer' }}><div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-heading)' }}>All entities</div><div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>Group-wide totals for all 40 companies. New entities included automatically.</div></div>
              <div style={{ flex: 1, border: '1.5px solid var(--color-primary)', background: 'var(--orange-50)', borderRadius: 12, padding: '14px 16px', cursor: 'pointer' }}><div style={{ fontSize: 14, fontWeight: 700, color: 'var(--text-heading)' }}>Selected entities</div><div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>Only the drafts belonging to the entities ticked below.</div></div>
            </div>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}><span style={{ fontSize: 13, color: 'var(--text-muted)' }}>3 of 40 entities selected</span><span style={{ flex: 1 }} /><button style={{ border: 'none', background: 'none', fontSize: 12, fontWeight: 700, color: 'var(--text-link)', cursor: 'pointer' }}>Select all 40</button><button style={{ border: 'none', background: 'none', fontSize: 12, fontWeight: 700, color: 'var(--text-muted)', cursor: 'pointer' }}>Clear</button></div>
              <Input placeholder="Search entities" />
              <div style={{ marginTop: 10, maxHeight: 236, overflow: 'auto', border: '1px solid var(--border-subtle)', borderRadius: 10, padding: '10px 12px', display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1fr)', gap: '8px 16px' }}>
                {VM.entities.slice(0, 16).map((e, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, minWidth: 0 }}>
                    <Checkbox checked={['ABKK', 'ABKJ', 'ABSH'].includes(e.code)} /><Code>{e.code}</Code><span style={{ flex: 1, minWidth: 0, color: 'var(--text-body)', ...Ellip }}>{e.short}</span>
                  </div>))}
              </div>
            </div>
            <div style={{ background: 'var(--neutral-50)', borderRadius: 10, padding: '12px 14px', fontSize: 13, color: 'var(--text-body)' }}>Receives draft totals for 3 entities only.</div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}><Button variant="outline" size="md" onClick={() => setAssignOpen(false)}>Cancel</Button><Button variant="primary" size="md" onClick={() => setAssignOpen(false)}>Save assignment</Button></div>
          </div>
        </Dialog>

        {/* Demo affordance: preview the Mark-as-paid dialog */}
        <button onClick={() => setPaidOpen(true)} title="Preview: Mark bills as paid dialog" style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 50, border: '1px solid var(--border-default)', background: 'var(--surface-card)', color: 'var(--text-muted)', borderRadius: 999, padding: '8px 14px', fontSize: 12, fontWeight: 700, cursor: 'pointer', boxShadow: 'var(--shadow-sm)' }}>Preview: Mark-as-paid dialog</button>
        <Dialog open={paidOpen} onClose={() => setPaidOpen(false)} title="Mark bills as paid" description="3 bills · RM 23,850.60" size="md">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Input label="Date paid" type="date" value="2026-09-04" />
            <Select label="Paid from" options={['Maybank Current 5142 (MYR)', 'CIMB Operating 8830 (MYR)', 'HSBC Collections 2201 (MYR)', 'Petty Cash (MYR)']} value="Maybank Current 5142 (MYR)" />
            <div style={{ gridColumn: '1 / -1' }}><Input label="Reference" placeholder="e.g. MBB-FT-20260904-01" hint="Shown on the Xero payment in every entity." /></div>
            <div style={{ gridColumn: '1 / -1' }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-heading)', marginBottom: 6 }}>Payment slip <span style={{ fontWeight: 400, color: 'var(--text-muted)' }}>· required</span></div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14, border: '1.5px dashed var(--border-default)', background: 'var(--surface-card)', borderRadius: 10, padding: '14px 16px', cursor: 'pointer' }}>
                <span style={{ display: 'grid', placeItems: 'center', width: 38, height: 38, borderRadius: 10, background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', color: 'var(--text-muted)', flex: '0 0 auto' }}><Icon name="paperclip" size={18} /></span>
                <span style={{ flex: 1, minWidth: 0 }}><span style={{ display: 'block', fontSize: 13, fontWeight: 700, color: 'var(--text-heading)' }}>Attach payment slip</span><span style={{ display: 'block', fontSize: 12, color: 'var(--text-muted)' }}>PDF or image · bank transfer slip or receipt</span></span>
              </div>
            </div>
            <div style={{ gridColumn: '1 / -1', background: 'var(--neutral-50)', borderRadius: 10, padding: '12px 14px', fontSize: 13, color: 'var(--text-body)' }}>Marks the selected bills paid in Xero across every entity and records the payment against the chosen account.</div>
            <div style={{ gridColumn: '1 / -1', display: 'flex', alignItems: 'center', gap: 12, border: '1px solid var(--border-subtle)', borderLeft: '4px solid var(--color-secondary)', borderRadius: 10, padding: '14px 16px' }}>
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-heading)' }}>Generate bank payment file</div><div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Maybank M2E (CSV) · download it from Bank files and upload to the portal.</div></div>
              <Switch checked={true} />
            </div>
            <div style={{ gridColumn: '1 / -1', display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 4 }}><Button variant="outline" size="md" onClick={() => setPaidOpen(false)}>Cancel</Button><Button variant="primary" size="md" onClick={() => setPaidOpen(false)}>Mark 3 as paid</Button></div>
          </div>
        </Dialog>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
